
name: Build Open Health IPA

on:
  workflow_dispatch:
  push:
    branches: [codex/scriptable-integration]
  
permissions:
  contents: write

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck Swift before building Rust
        working-directory: apps/ios/OuraApp
        run: |
          SOURCES=$(python3 -c 'import re; text=open("project-ci.yml").read().split("    sources:",1)[1].split("    dependencies:",1)[0]; print(" ".join(re.findall(r"path: (\S+\.swift)",text)))')
          swiftc -typecheck -parse-as-library -module-name OuraApp \
            -target arm64-apple-ios17.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -Xcc -fmodule-map-file=../generated/oura_coreFFI.modulemap $SOURCES

  build:
    needs: swift
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Rust framework and Xcode project
        run: |
          bash ci_scripts/ci_post_clone.sh

      - name: Compile iPhone application
        working-directory: apps/ios/OuraApp
        run: |
          xcodebuild \
            -project OuraApp.xcodeproj \
            -scheme OuraApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate Scriptable exports on simulator
        working-directory: apps/ios/OuraApp
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS-26" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild test -project OuraApp.xcodeproj -scheme OuraApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -only-testing:OuraAppTests/ScriptableTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/OuraApp.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          APP="Payload/OuraApp.app"
          WIDGET="$APP/PlugIns/ActivityWidget.appex"
          test -f "$WIDGET/Info.plist"
          # Retain each target's entitlement requests for the final signer.
          codesign --force --sign - --generate-entitlement-der \
            --entitlements apps/ios/OuraApp/ActivityWidget/ActivityWidget.entitlements "$WIDGET"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements apps/ios/OuraApp/OuraApp.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          zip -qry OpenHealth-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenHealth-unsigned-IPA
          path: OpenHealth-unsigned.ipa
          retention-days: 7
      
      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            OpenHealth-unsigned.ipa \
            --title "Open Health IPA Build ${GITHUB_RUN_NUMBER}" \
            --notes "IPA for re-signing. The Activity widget requires the shared App Group entitlement on both targets." \
            --target "$GITHUB_SHA"

        
