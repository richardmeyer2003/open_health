
name: Build Open Health IPA

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Rust framework and Xcode project
        run: |
          bash ci_scripts/ci_post_clone.sh

      - name: Compile iPhone application
        working-directory: apps/ios/OuraApp
        run: |
          xcodebuild \
            -project OuraApp.xcodeproj \
            -scheme OuraApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/OuraApp.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          APP="Payload/OuraApp.app"
          WIDGET="$APP/PlugIns/ActivityWidget.appex"
          test -f "$WIDGET/Info.plist"
          # Retain each target's entitlement requests for the final signer.
          codesign --force --sign - --generate-entitlement-der \
            --entitlements apps/ios/OuraApp/ActivityWidget/ActivityWidget.entitlements "$WIDGET"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements apps/ios/OuraApp/OuraApp.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          zip -qry OpenHealth-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenHealth-unsigned-IPA
          path: OpenHealth-unsigned.ipa
          retention-days: 7
      
      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            OpenHealth-unsigned.ipa \
            --title "Open Health IPA Build ${GITHUB_RUN_NUMBER}" \
            --notes "IPA for re-signing. The Activity widget requires the shared App Group entitlement on both targets." \
            --target "$GITHUB_SHA"

        
